<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Type Master</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⌨ Type Master</h1>

        <div id="sentence" class="sentence"></div>
        <div class="cursor" id="cursor"></div>

        <textarea id="input" placeholder="Start typing here..."></textarea>

        <!-- Keyboard -->
        <div class="keyboard" id="keyboard">
            <div class="row">
                <span class="key">Q</span><span class="key">W</span><span class="key">E</span><span class="key">R</span>
                <span class="key">T</span><span class="key">Y</span><span class="key">U</span><span class="key">I</span>
                <span class="key">O</span><span class="key">P</span>
            </div>
            <div class="row">
                <span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="key">F</span>
                <span class="key">G</span><span class="key">H</span><span class="key">J</span><span class="key">K</span>
                <span class="key">L</span>
            </div>
            <div class="row">
                <span class="key">Z</span><span class="key">X</span><span class="key">C</span><span class="key">V</span>
                <span class="key">B</span><span class="key">N</span><span class="key">M</span>
            </div>
            <div class="row">
                <span class="key space">SPACE</span>
            </div>
        </div>

        <div class="stats">
            <p>⏱ Time: <span id="time">60</span>s</p>
            <p>🚀 WPM: <span id="wpm">0</span></p>
            <p>🎯 Accuracy: <span id="accuracy">0</span>%</p>
        </div>

        <button onclick="resetTest()">Restart</button>

    </div>
    <div id="resultScreen" class="result-screen">
        <div class="result-box">
            <h2>Time's Up!</h2>
            <p id="finalWpm">WPM: 0</p>
            <p id="finalAccuracy">Accuracy: 0%</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
